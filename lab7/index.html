<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>lab 7</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Генерация геометрических фигур</h1>
    <label for="shape-count">Количество фигур:</label>
    <input type="number" id="shape-count" min="1" value="5" />
    <label for="shape-type">Тип фигуры:</label>
    <select id="shape-type">
        <option value="circle">Круг</option>
        <option value="square">Квадрат</option>
        <option value="triangle">Треугольник</option>
    </select>
    <button id="generate-btn">Создать фигуры</button>
    <div id="container"></div>
    <script src="script.js"></script>
</body>
</html>
